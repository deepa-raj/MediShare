server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # React Router uses client-side routing — any path that isn't a real file
  # (e.g. /donor, /ngo) must still serve index.html so the app's router can
  # take over, otherwise refreshing a deep link 404s at the nginx level.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
