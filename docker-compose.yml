services:
  server:
    build: ./server
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-in-production}
      - DATABASE_PATH=/app/data/medishare.db
    volumes:
      # Named volume so the SQLite file survives `docker compose down` /
      # rebuilds — without this, every rebuild would start from an empty db.
      - medishare-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3

  client:
    build:
      context: ./client
      args:
        # Browser-facing URL — different from the server-to-server URL
        # because the browser talks to "localhost", not the "server"
        # service name (that name only resolves inside the compose network).
        VITE_API_URL: http://localhost:4000/api
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  medishare-data:
